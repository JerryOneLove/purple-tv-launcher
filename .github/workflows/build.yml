name: Build Purple TV Launcher APK

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Generate Project Files
        run: |
          mkdir -p app/src/main/java/com/my/purplelauncher
          
          cat << 'EOF' > settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "PurpleTVLauncher"
          include ':app'
          EOF

          cat << 'EOF' > build.gradle
          plugins {
              id 'com.android.application' version '8.2.2' apply false
              id 'org.jetbrains.kotlin.android' version '1.9.22' apply false
          }
          EOF

          cat << 'EOF' > gradle.properties
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          kotlin.code.style=official
          EOF

          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }
          android {
              namespace 'com.my.purplelauncher'
              compileSdk 34
              defaultConfig {
                  applicationId "com.my.purplelauncher"
                  minSdk 21
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = '17'
              }
          }
          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
          }
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://android.com">
              <uses-feature android:name="android.software.leanback" android:required="false" />
              <uses-feature android:name="android.hardware.touchscreen" android:required="false" />
              <queries>
                  <package android:name="llc.itdev.incy" />
                  <package android:name="com.google.android.youtube.tv" />
                  <package android:name="ru.kinopoisk.tv" />
                  <package android:name="com.vk.tv" />
                  <package android:name="ru.rutube.app" />
                  <package android:name="tv.okko.androidtv" />
                  <package android:name="com.yandex.browser.tv" />
              </queries>
              <application
                  android:allowBackup="false"
                  android:label="Purple TV"
                  android:theme="@style/Theme.AppCompat.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTask"
                      android:stateNotNeeded="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.HOME" />
                          <category android:name="android.intent.category.DEFAULT" />
                          <category android:name="android.intent.category.LEANBACK_LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat << 'EOF' > app/src/main/java/com/my/purplelauncher/MainActivity.kt
          package com.my.purplelauncher

          import android.content.Intent
          import android.graphics.Color
          import android.graphics.drawable.GradientDrawable
          import android.os.Bundle
          import android.provider.Settings
          import android.view.Gravity
          import android.widget.GridLayout
          import android.widget.LinearLayout
          import android.widget.TextClock
          import android.widget.TextView
          import android.widget.Toast
          import androidx.appcompat.app.AppCompatActivity

          class MainActivity : AppCompatActivity() {

              private val bgDark = Color.parseColor("#1C1B22")
              private val cardGray = Color.parseColor("#2B2936")
              private val cardFocused = Color.parseColor("#453E5C")
              private val accentPurple = Color.parseColor("#A799FF")
              private val textMain = Color.parseColor("#EAE6F5")

              data class TvApp(val title: String, val pkg: String)

              private val myApps = listOf(
                  TvApp("YouTube", "com.google.android.youtube.tv"),
                  TvApp("Кинопоиск", "ru.kinopoisk.tv"),
                  TvApp("VK Видео", "com.vk.tv"),
                  TvApp("Rutube", "ru.rutube.app"),
                  TvApp("Okko", "tv.okko.androidtv"),
                  TvApp("Браузер", "com.yandex.browser.tv")
              )

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)

                  val root = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setBackgroundColor(bgDark)
                      setPadding(64, 48, 64, 48)
                  }

                  val topBar = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      gravity = Gravity.CENTER_VERTICAL
                  }

                  val vpnBtn = createTile("🛡 ВКЛЮЧИТЬ VPN (INCY)", isAccent = true) {
                      launchPkg("llc.itdev.incy")
                  }.apply {
                      layoutParams = LinearLayout.LayoutParams(0, 130, 1f).apply { rightMargin = 24 }
                  }

                  val settingsBtn = createTile("⚙ Настройки", isAccent = false) {
                      startActivity(Intent(Settings.ACTION_SETTINGS))
                  }.apply {
                      layoutParams = LinearLayout.LayoutParams(320, 130).apply { rightMargin = 32 }
                  }

                  val clock = TextClock(this).apply {
                      format24Hour = "HH:mm"
                      textSize = 36f
                      setTextColor(textMain)
                  }

                  topBar.addView(vpnBtn)
                  topBar.addView(settingsBtn)
                  topBar.addView(clock)
                  root.addView(topBar)

                  val grid = GridLayout(this).apply {
                      columnCount = 3
                      layoutParams = LinearLayout.LayoutParams(
                          LinearLayout.LayoutParams.MATCH_PARENT,
                          LinearLayout.LayoutParams.WRAP_CONTENT
                      ).apply { topMargin = 48 }
                  }

                  for (app in myApps) {
                      val tile = createTile(app.title, isAccent = false) {
                          launchPkg(app.pkg)
                      }.apply {
                          layoutParams = GridLayout.LayoutParams().apply {
                              width = 0
                              height = 200
                              columnSpec = GridLayout.spec(GridLayout.UNDEFINED, 1f)
                              setMargins(12, 12, 12, 12)
                          }
                      }
                      grid.addView(tile)
                  }

                  root.addView(grid)
                  setContentView(root)
                  vpnBtn.requestFocus()
              }

              private fun createTile(label: String, isAccent: Boolean, onClick: () -> Unit): TextView {
                  return TextView(this).apply {
                      text = label
                      textSize = if (isAccent) 22f else 24f
                      setTextColor(textMain)
                      gravity = Gravity.CENTER
                      isFocusable = true
                      isFocusableInTouchMode = true
                      background = makeBg(false, isAccent)

                      setOnFocusChangeListener { v, hasFocus ->
                          v.background = makeBg(hasFocus, isAccent)
                          v.animate().scaleX(if (hasFocus) 1.04f else 1f)
                              .scaleY(if (hasFocus) 1.04f else 1f).setDuration(120).start()
                      }
                      setOnClickListener { onClick() }
                  }
              }

              private fun makeBg(focused: Boolean, isAccent: Boolean): GradientDrawable {
                  return GradientDrawable().apply {
                      cornerRadius = 24f
                      setColor(
                          when {
                              focused -> cardFocused
                              isAccent -> Color.parseColor("#3B3354")
                              else -> cardGray
                          }
                      )
                      setStroke(if (focused) 5 else 2, if (focused || isAccent) accentPurple else Color.parseColor("#3F3D4D"))
                  }
              }

              private fun launchPkg(pkg: String) {
                  val intent = packageManager.getLeanbackLaunchIntentForPackage(pkg)
                      ?: packageManager.getLaunchIntentForPackage(pkg)
